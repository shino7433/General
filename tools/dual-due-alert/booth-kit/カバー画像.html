<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:1200px; }
  body {
    font-family: "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background: linear-gradient(150deg,#0f2740 0%,#12395c 55%,#0d5a53 100%);
    color:#fff; width:1200px; height:1200px; position:relative; overflow:hidden;
  }
  .wrap { position:absolute; inset:0; padding:96px 90px; display:flex; flex-direction:column; }
  .kicker { display:inline-flex; align-items:center; gap:14px; font-size:30px; font-weight:700; letter-spacing:.04em; color:#8fd8c9; }
  .kicker .dot { width:16px; height:16px; border-radius:50%; background:#37d0a6; box-shadow:0 0 20px #37d0a6; }
  h1 { margin-top:34px; font-size:104px; font-weight:900; line-height:1.14; letter-spacing:.01em; }
  h1 .x { color:#ffd24a; }
  .sub { margin-top:30px; font-size:44px; font-weight:800; line-height:1.4; color:#eaf3ff; }
  .sub b { color:#ffd24a; }
  .bubbles { margin-top:56px; display:flex; flex-direction:column; gap:26px; }
  .bubble { display:flex; align-items:center; gap:24px; background:rgba(255,255,255,.10); border:1.5px solid rgba(255,255,255,.18);
            border-radius:26px; padding:30px 36px; backdrop-filter:blur(2px); }
  .bubble .ic { width:66px; height:66px; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:38px; flex:0 0 auto; }
  .pay .ic { background:#ffd24a; color:#12395c; }
  .recv .ic { background:#ff7a7a; color:#3a0d0d; }
  .bubble .txt { font-size:38px; font-weight:800; line-height:1.3; }
  .bubble .txt small { display:block; font-size:27px; font-weight:600; color:#c7d6ea; margin-top:4px; }
  .foot { margin-top:auto; display:flex; align-items:center; justify-content:space-between; }
  .badges { display:flex; gap:18px; }
  .badge { font-size:32px; font-weight:800; padding:16px 30px; border-radius:16px; }
  .line { background:#06c755; color:#fff; }
  .slack { background:#fff; color:#3f1150; }
  .tag { font-size:32px; font-weight:800; color:#0f2740; background:#8fd8c9; padding:16px 30px; border-radius:16px; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="kicker"><span class="dot"></span>個人事業主・フリーランスの お金の期日管理</span>
    <h1>売掛<span class="x">×</span>買掛<br>期日ダブルアラート</h1>
    <div class="sub"><b>入金の遅延督促</b> と <b>支払い忘れ防止</b> を、<br>1枚のスプレッドシートで自動通知。</div>
    <div class="bubbles">
      <div class="bubble pay"><div class="ic">💰</div><div class="txt">【支払】仕入先A への 50,000円 の支払期日は 残り3日<small>買掛：期日の前に“先回り”通知</small></div></div>
      <div class="bubble recv"><div class="ic">⏰</div><div class="txt">【入金遅延】取引先B からの 80,000円 が期日超過<small>売掛：入金されるまで“督促”通知</small></div></div>
    </div>
    <div class="foot">
      <div class="badges"><span class="badge line">LINE</span><span class="badge slack">Slack</span></div>
      <span class="tag">GASテンプレ / 設定かんたん</span>
    </div>
  </div>
</body>
</html>
